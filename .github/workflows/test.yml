name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      # Example missions: nominal, low battery, and a VO dropout. Exit code is non-zero on a crash.
      - run: python -m rowpilot run --quiet --out runs/nominal
      - run: python -m rowpilot run --quiet --battery 60 --out runs/low-battery
      - run: python -m rowpilot run --quiet --vo-dropout 60:1.5 --vo-dropout 200:10 --out runs/vo-dropout
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: mission-runs
          path: runs/
