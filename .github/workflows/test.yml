name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      # Example missions: nominal, low battery, and a VO dropout. Exit code is non-zero on a crash.
      - run: python -m rowpilot run --quiet --out runs/nominal
      - run: python -m rowpilot run --quiet --battery 45 --out runs/low-battery
      - run: python -m rowpilot run --quiet --vo-dropout 60:1.5 --vo-dropout 200:10 --out runs/vo-dropout
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: mission-runs
          path: runs/

  editor-web:
    # The editor's web page: unit tests, type check and build; then the Python tests again with the
    # built page in place, so the server is also tested serving it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_editor.py
