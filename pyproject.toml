[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rowpilot"
version = "0.1.0"
description = "GPS-free greenhouse drone: behaviour-tree mission, lane-centric visual odometry, PX4 SITL + Gazebo."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nada Fahim" }]
dependencies = ["numpy>=1.24", "py_trees>=2.2"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib>=3.6"]

[project.scripts]
rowpilot = "rowpilot.cli:main"

[tool.setuptools]
packages = ["rowpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
